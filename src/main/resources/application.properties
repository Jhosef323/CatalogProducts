spring.application.name=CatalogProducts
server.port=${PORT:10000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.jakarta.persistence.jdbc.url=${DB_URL}
spring.jpa.properties.jakarta.persistence.jdbc.user=${DB_USERNAME}
spring.jpa.properties.jakarta.persistence.jdbc.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false